services:
  web:
    build: .
    image: termos-patrimonio:latest
    container_name: termos-patrimonio
    restart: unless-stopped
    env_file:
      # Credenciais do bucket de fotos (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT_URL, R2_BUCKET_NAME, R2_PUBLIC_URL).
      # Sem o arquivo, as fotos do inventário ficam desativadas e o resto funciona.
      - path: secrets/.env
        required: false
    ports:
      - "127.0.0.1:12012:8000"
    volumes:
      # termos.db e timbrado.docx vivem aqui; backup = copiar a pasta dados/
      - ./dados:/app/dados
