{% extends "base.html" %}
{% from "_macros.html" import select %}
{% block titulo %}Termo individual{% endblock %}
{% block conteudo %}
<div class="d-flex align-items-center mb-4"><h1 class="mb-0">Termo individual</h1></div>
<form method="post" action="{{ url_for('gerar_individual') }}" class="col-md-8">
  <div class="mb-3">{{ select('nome', 'Pessoa', nomes) }}</div>
  <button class="br-button primary" type="submit"><i class="fas fa-file-alt mr-1" aria-hidden="true"></i>Gerar termo</button>
</form>
{% endblock %}
