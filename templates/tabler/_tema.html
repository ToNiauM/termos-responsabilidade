{# Tema claro/escuro antes do CSS pintar (sem piscar): a escolha salva no navegador ou, em "automático", a do sistema. #}
<script>
(function () {
  var escolha = "auto";
  try { escolha = localStorage.getItem("termos-tema") || "auto"; } catch (e) {}
  var escuro = escolha === "escuro" || (escolha !== "claro" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-bs-theme", escuro ? "dark" : "light");
})();
</script>
