{# Aparência antes do CSS pintar (sem piscar). Com login: a escolha gravada na conta (APARENCIA). Sem conta (login, modo desktop): a última escolha deste navegador. "auto" segue o claro/escuro do sistema. #}
<script>
(function () {
  var doServidor = {% if USUARIO and USUARIO.id %}{{ APARENCIA|tojson }}{% else %}null{% endif %};
  var a = doServidor;
  try {
    if (a) localStorage.setItem("termos-aparencia", JSON.stringify(a));
    else a = JSON.parse(localStorage.getItem("termos-aparencia") || "null");
  } catch (e) {}
  a = a || {"tema": "auto", "cor": "blue", "base": "slate", "cantos": "1"};
  var raiz = document.documentElement;
  var escuro = a.tema === "escuro" || (a.tema !== "claro" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  raiz.setAttribute("data-bs-theme", escuro ? "dark" : "light");
  raiz.setAttribute("data-bs-theme-primary", a.cor);
  raiz.setAttribute("data-bs-theme-base", a.base);
  raiz.setAttribute("data-bs-theme-radius", a.cantos);
})();
</script>
